<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Yiğit Özçelik — Computer Engineering at Ankara University">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#0f1b33"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#18254a" stroke-width="1"/>
    </pattern>
    <radialGradient id="beam" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#2ee6c5" stop-opacity=".55"/>
      <stop offset="1" stop-color="#2ee6c5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
    <path id="route" d="M600 250 C700 250 720 90 820 90 S960 230 1040 200 S1150 60 1220 70"/>
  </defs>
  <style>
    .name { font: 700 54px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #f1f5ff; letter-spacing: .5px; }
    .sub { font: 500 20px ui-monospace, 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #2ee6c5; }
    .tag { font: 400 16px ui-monospace, 'JetBrains Mono', Consolas, monospace; fill: #8ea2c9; }
    .cursor { animation: blink 1s steps(1) infinite; }
    .lane { stroke-dasharray: 14 12; animation: flow 1.2s linear infinite; }
    .pt { fill: #2ee6c5; opacity: 0; animation: hit 4s ease-out infinite; }
    .obs { fill: #1b2a52; stroke: #3b5591; stroke-width: 1.5; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @keyframes hit { 0%, 100% { opacity: 0; } 8% { opacity: 1; } 45% { opacity: .15; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity=".7"/>

    <!-- road -->
    <use href="#route" fill="none" stroke="#1a2647" stroke-width="44" stroke-linecap="round"/>
    <use href="#route" fill="none" stroke="#24345f" stroke-width="2" class="lane"/>

    <!-- obstacles + the points the lidar returns on them -->
    <rect class="obs" x="700" y="150" width="34" height="34" rx="4"/>
    <rect class="obs" x="880" y="40" width="40" height="26" rx="4"/>
    <rect class="obs" x="930" y="232" width="30" height="30" rx="4"/>
    <rect class="obs" x="1100" y="160" width="36" height="36" rx="4"/>
    <g>
      <circle class="pt" cx="700" cy="156" r="2.4" style="animation-delay:.2s"/>
      <circle class="pt" cx="700" cy="168" r="2.4" style="animation-delay:.3s"/>
      <circle class="pt" cx="706" cy="150" r="2.4" style="animation-delay:.35s"/>
      <circle class="pt" cx="734" cy="176" r="2.4" style="animation-delay:.5s"/>
      <circle class="pt" cx="886" cy="66" r="2.4" style="animation-delay:1.4s"/>
      <circle class="pt" cx="900" cy="66" r="2.4" style="animation-delay:1.5s"/>
      <circle class="pt" cx="914" cy="66" r="2.4" style="animation-delay:1.6s"/>
      <circle class="pt" cx="936" cy="232" r="2.4" style="animation-delay:2.2s"/>
      <circle class="pt" cx="948" cy="232" r="2.4" style="animation-delay:2.3s"/>
      <circle class="pt" cx="930" cy="244" r="2.4" style="animation-delay:2.35s"/>
      <circle class="pt" cx="1100" cy="170" r="2.4" style="animation-delay:3s"/>
      <circle class="pt" cx="1100" cy="184" r="2.4" style="animation-delay:3.1s"/>
      <circle class="pt" cx="1112" cy="160" r="2.4" style="animation-delay:3.15s"/>
    </g>

    <!-- vehicle -->
    <g>
      <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
        <mpath href="#route"/>
      </animateMotion>
      <path d="M0 0 L120 -46 A124 124 0 0 1 120 46 Z" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate" values="-35;35;-35" dur="1.6s" repeatCount="indefinite"/>
      </path>
      <circle r="10" fill="none" stroke="#2ee6c5" stroke-width="1.5">
        <animate attributeName="r" values="10;70" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values=".8;0" dur="1.4s" repeatCount="indefinite"/>
      </circle>
      <rect x="-18" y="-11" width="36" height="22" rx="6" fill="#f1f5ff"/>
      <rect x="4" y="-8" width="9" height="16" rx="2" fill="#0f1b33"/>
      <circle r="4" fill="#2ee6c5"/>
    </g>

    <!-- text -->
    <text x="56" y="118" class="name">Yiğit Özçelik</text>
    <text x="58" y="162" class="sub">Computer Engineering @ Ankara University</text>
    <text x="58" y="200" class="tag">&gt; autonomous systems · robotics · web<tspan class="cursor" fill="#2ee6c5">▍</tspan></text>
    <text x="58" y="250" class="tag" fill="#5b6f99" style="fill:#5b6f99">ROS 2 · Gazebo · CARLA · Python · C++ · JavaScript</text>
  </g>
</svg>
